<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forge Smart Home - Environmental Monitoring</title>
  <style>
    /* Dark theme with glassmorphism */
    body {
      background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    
    .hero {
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 60px 40px;
      text-align: center;
    }
    
    h1 {
      font-size: 3em;
      background: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
    }
    
    .cta-button {
      background: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
      padding: 12px 40px;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.3s;
    }
    
    .cta-button:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Forge Smart Home</h1>
    <p>24/7 Environmental Monitoring & Automation</p>
    <button class="cta-button" onclick="goToLogin()">Get Started</button>
  </div>
</body>
</html>
